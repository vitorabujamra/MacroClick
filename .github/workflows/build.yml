name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: cp app/build/outputs/apk/release/app-release.apk MacroClick.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MacroClick-apk
          path: MacroClick.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MacroClick.apk \
            --title "MacroClick build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."
